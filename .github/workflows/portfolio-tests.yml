name: Portfolio browser tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Optional live URL to test instead of repository files (e.g. https://debadatta-portfolio.vercel.app/)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  browser-tests:
    name: Chromium — desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_BASE_URL: ${{ inputs.test_url || '' }}
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm test
      - name: Upload HTML report, screenshots, and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: portfolio-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 21
          if-no-files-found: warn

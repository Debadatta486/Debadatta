<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debadatta Dutta — Portfolio</title><meta name="description" content="Debadatta Dutta — technical writing, documentation engineering, and selected work."><style>
:root{--ink:#17382d;--cream:#f2efe6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}body{overflow-x:hidden}.cover{min-height:100svh;display:flex;flex-direction:column;padding:clamp(20px,4vw,54px)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{font:800 30px Georgia,serif;text-decoration:none;color:inherit}.top small{font-size:11px;letter-spacing:.15em;text-transform:uppercase}.clock{text-align:right}.clock-tile{background:#e6e7db;border:1px solid #c8cfc4;border-radius:16px;padding:14px;display:flex;align-items:center;gap:15px}.analog{position:relative;width:108px;height:108px;border-radius:50%;border:2px solid #17382d;background:#f8f6ed;flex-shrink:0;box-shadow:0 4px 12px #17382d16}.analog b{position:absolute;font:600 11px Arial}.twelve{top:5px;left:46%}.six{bottom:5px;left:49%}.three{right:7px;top:46%}.nine{left:7px;top:46%}.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom center;background:#17382d;border-radius:6px}.hour{width:4px;height:27px;margin-left:-2px}.minute{width:3px;height:39px;margin-left:-1.5px}.second{width:1.5px;height:42px;background:#c16b50;margin-left:-.75px}.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:#c16b50;border-radius:50%}.title em{background:linear-gradient(100deg,#227bc0,#29bca8,#c87ed8,#e7a86e,#227bc0);background-size:300% 100%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:colorFlow 7s linear infinite}@keyframes colorFlow{to{background-position:300% 0}}.clock .time{font:600 clamp(22px,3vw,36px)/1.1 monospace;letter-spacing:-.07em}.clock .place{margin-top:8px;font-size:11px;letter-spacing:.15em;text-transform:uppercase}.center{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1200px}.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:26px}.title{font-size:clamp(65px,12.8vw,205px);letter-spacing:-.09em;line-height:.83;font-weight:800;margin:0}.title span{display:block;overflow:hidden}.title span b{display:inline-block;animation:cutUp 1s both cubic-bezier(.2,.8,.2,1)}.title span:nth-child(2) b{animation-delay:.14s}.title span:nth-child(3) b{animation-delay:.28s}.title em{font-style:normal;color:#3d7b66}.sub{margin-top:38px;font-size:clamp(16px,2vw,23px);max-width:590px;line-height:1.4}.bottom{display:flex;justify-content:space-between;align-items:end;gap:20px}.enter{background:var(--ink);color:var(--cream);padding:18px 25px;text-decoration:none;font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-radius:100px;transition:transform .25s}.enter:hover{transform:translateY(-4px)}.bottom p{font-size:12px;opacity:.65}.wipe{position:fixed;inset:0;background:var(--ink);z-index:10;clip-path:inset(0 100% 0 0);transition:clip-path .55s cubic-bezier(.77,0,.18,1)}.wipe.go{clip-path:inset(0 0 0 0)}@keyframes cutUp{from{transform:translateY(105%)}to{transform:translateY(0)}}.clock-tile .time{font-size:15px}@media(max-width:600px){.clock-tile{padding:9px;gap:6px}.analog{width:80px;height:80px}.analog .hour{height:20px}.analog .minute{height:28px}.analog .second{height:30px}.clock .place{font-size:9px}.cover{padding:24px}.title{font-size:clamp(60px,15vw,110px)}.bottom{align-items:start;flex-direction:column-reverse}.sub{margin-top:30px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="cover"><header class="top"><a class="brand" href="index.html" aria-label="Debadatta Dutta cover">DD</a><div class="clock" aria-label="Current time in Hyderabad"><div class="clock-tile"><div class="analog"><i class="hand hour" id="hourhand"></i><i class="hand minute" id="minutehand"></i><i class="hand second" id="secondhand"></i><i class="pin"></i><b class="twelve">12</b><b class="three">3</b><b class="six">6</b><b class="nine">9</b></div><div id="time" class="time">--:--:--</div></div><div class="place">Hyderabad, India · IST</div></div></header><div class="center"><div class="eyebrow">Technical writing / Documentation engineering</div><h1 class="title"><span><b>Making</b></span><span><b>complexity</b></span><span><b><em>clear.</em></b></span></h1><p class="sub">Debadatta Dutta — technical writer building documentation that helps people understand and use complex products.</p></div><footer class="bottom"><p>Selected work · Experience · Expertise · Contact</p><a class="enter" href="home.html">Explore portfolio &nbsp; ↗</a></footer></main><div class="wipe" id="wipe"></div><script>
function clock(){document.getElementById('time').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date())}clock();setInterval(clock,1000);
function hands(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'numeric',second:'numeric',hour12:false}).formatToParts(new Date());const v=Object.fromEntries(parts.map(x=>[x.type,Number(x.value)]));const h=v.hour%12,m=v.minute,sec=v.second;document.getElementById('hourhand').style.transform=`rotate(${h*30+m*.5}deg)`;document.getElementById('minutehand').style.transform=`rotate(${m*6+sec*.1}deg)`;document.getElementById('secondhand').style.transform=`rotate(${sec*6}deg)`;}hands();setInterval(hands,1000);
document.querySelector('.enter').addEventListener('click',e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;e.preventDefault();document.getElementById('wipe').classList.add('go');setTimeout(()=>location.href='home.html',560)});
</script></body></html>
